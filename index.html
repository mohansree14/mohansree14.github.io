<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mohansree Vijayakumar · 3D Portfolio</title>
<meta name="description" content="AI Engineer — LLMs, RAG and agentic systems. Explore my work as an interactive 3D world.">
<meta property="og:title" content="Mohansree Vijayakumar · 3D Portfolio">
<meta property="og:description" content="AI Engineer — LLMs, RAG and agentic systems. Explore my work as an interactive 3D world.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%237c5cff'/><ellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%2322d3ee' stroke-width='2'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05070f; --ink: #e8ecf8; --muted: #8b93ad; --line: rgba(255,255,255,.1);
    --glass: rgba(14,18,34,.72); --accent: #7c5cff; --accent2: #22d3ee;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; display: block; }
  a { color: var(--accent2); }
  .hud { position: fixed; top: 20px; left: 24px; pointer-events: none; }
  .hud h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); font-weight: 700; letter-spacing: -.02em; }
  .hud p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .hud .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--accent2); }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .label { position: absolute; transform: translate(-50%, -150%); pointer-events: auto; cursor: pointer;
    font: 500 13px 'Space Grotesk', sans-serif; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(6px); transition: opacity .2s; }
  .label:hover { border-color: var(--accent2); }
  #dock { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
    padding: 6px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    backdrop-filter: blur(10px); max-width: calc(100vw - 32px); overflow-x: auto; }
  #dock button { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 10px; font-size: 13px; white-space: nowrap; }
  #dock button:hover, #dock button:focus-visible, #dock button[aria-pressed="true"] { background: rgba(124,92,255,.25); }
  .hint { position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); margin: 0;
    color: var(--muted); font-size: 12px; pointer-events: none; white-space: nowrap; }
  #panel { position: fixed; top: 16px; right: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px));
    overflow-y: auto; padding: 22px 22px 28px; border-radius: 18px; background: var(--glass);
    border: 1px solid var(--line); backdrop-filter: blur(14px); transform: translateX(calc(100% + 24px));
    transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 4px; font-size: 24px; }
  #panel .kicker { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent2); }
  #panel h3 { margin: 18px 0 2px; font-size: 15px; }
  #panel .meta { color: var(--muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  #panel p, #panel li { color: #c9cfe2; font-size: 14px; line-height: 1.55; }
  #panel ul { padding-left: 18px; margin: 6px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: #c9cfe2; }
  .stat { font-size: 44px; font-weight: 700; line-height: 1; background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #close { all: unset; cursor: pointer; float: right; font-size: 22px; line-height: 1; padding: 2px 8px; border-radius: 8px; color: var(--muted); }
  #close:hover { color: var(--ink); background: rgba(255,255,255,.08); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
  @media (max-width: 700px) {
    #panel { top: auto; left: 16px; right: 16px; width: auto; max-height: 62vh; transform: translateY(calc(100% + 24px)); }
    .hint { display: none; }
  }
</style>
</head>
<body>
<div id="loading">Entering the world…</div>
<canvas id="c" aria-label="Interactive 3D map of Mohansree's portfolio"></canvas>
<header class="hud">
  <div class="mono">~/mohansree14</div>
  <h1>Mohansree Vijayakumar</h1>
  <p>AI Engineer · LLMs, RAG &amp; agentic systems · Surrey, UK</p>
</header>
<div id="labels"></div>
<p class="hint">Drag to orbit · scroll to zoom · click a planet</p>
<nav id="dock" aria-label="Sections"></nav>
<aside id="panel" aria-live="polite"><button id="close" aria-label="Close">×</button><div id="panel-body"></div></aside>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GH = 'https://github.com/mohansree14/';
const KORNIA_PRS = 'https://github.com/kornia/kornia/pulls?q=is%3Apr+author%3Amohansree14+is%3Amerged';

const SECTIONS = [
  { id: 'about', title: 'About', color: 0x7c5cff, orbit: 9, size: 1.1, speed: .22, html: `
    <div class="kicker">Hello, world</div><h2>About me</h2>
    <p>I build AI systems that people actually use: LLM apps, RAG pipelines and agentic workflows, with a habit of chasing bugs down to the maths.</p>
    <p>I lead a four-person AI team at Workforce Training &amp; Development, and I contribute autograd fixes to Kornia, the PyTorch computer-vision library.</p>
    <div class="chips"><span class="chip">📍 Guildford, Surrey</span><span class="chip">🎓 MSc AI, Surrey</span><span class="chip">🧠 LLMs · RAG · Agents</span></div>` },
  { id: 'experience', title: 'Experience', color: 0x22d3ee, orbit: 13, size: 1.4, speed: .16, html: `
    <div class="kicker">Career orbit</div><h2>Experience</h2>
    <h3>AI Automation Trainer · Lead of the AI team</h3><div class="meta">Workforce Training &amp; Development · London · Jun 2026 – now</div>
    <ul><li>Lead the four-person AI team, reporting to the CEO.</li>
    <li>Building an agentic GenAI system on OpenAI and Gemini APIs with market-research tooling.</li>
    <li>Trainer on the Level 4 AI &amp; Automation Practitioner apprenticeship; contribute to the Level 5 AI Leadership programme.</li></ul>
    <h3>AI Developer (part-time, alongside MSc)</h3><div class="meta">Guardian AI · Remote · Oct 2025 – Jan 2026</div>
    <ul><li>Built the NLP system behind a consumer fraud-detection assistant that ran live with real users.</li>
    <li>RAG pipeline over FAISS: chunking, embedding, indexing, retrieval tuning.</li>
    <li>Fixed classifier over-confidence with schema redesign and structured output validation; served via FastAPI.</li></ul>
    <h3>Machine Learning Engineer Intern</h3><div class="meta">Soft4Hire · Chennai · Mar – Nov 2024</div>
    <ul><li>Hybrid recommender (LightFM + TF-IDF/BERT): <b>+40%</b> engagement in a live A/B test, <b>−60%</b> cold-start, <b>&lt;200 ms</b> inference.</li>
    <li>Dockerised and deployed on AWS Lambda and S3.</li></ul>
    <h3>Machine Learning Engineer Intern</h3><div class="meta">DLK Technology · Jun – Aug 2023</div>
    <ul><li>Time-series sales forecasting and anomaly detection on large-scale B2B data.</li></ul>` },
  { id: 'opensource', title: 'Open Source', color: 0xf472b6, orbit: 17, size: 1.25, speed: .12, html: `
    <div class="kicker">Kornia · PyTorch CV library · ~10k ★</div><h2>Open Source</h2>
    <div class="stat" id="pr-count">19</div><div class="meta">merged PRs, all maintainer-reviewed · <a href="${KORNIA_PRS}" target="_blank" rel="noopener">see them all ↗</a></div>
    <h3>Closed a bug open since 2021</h3>
    <p><code>Boxes3D.to_tensor</code> had blocked autograd since 2021. I showed the gradcheck failure was a false positive at a 4-way vertex tie, not a wrong gradient. <a href="https://github.com/kornia/kornia/pull/4184" target="_blank" rel="noopener">PR #4184</a></p>
    <h3>Finite gradients at the identity</h3>
    <p>SO(3), SE(3) and SE(2) exp/log all returned <code>nan</code> gradients at the identity, the usual start point for pose optimisation. I fixed all five maps and filled in the gradcheck tests that had been left as TODO stubs. <a href="https://github.com/kornia/kornia/pull/4405" target="_blank" rel="noopener">PR #4405</a></p>
    <h3>Silent float16 underflow</h3>
    <p><code>distance_transform</code> returned wrong distances in half precision at its own defaults. Fixed after two rounds of review. <a href="https://github.com/kornia/kornia/pull/4158" target="_blank" rel="noopener">PR #4158</a></p>` },
  { id: 'projects', title: 'Projects', color: 0x34d399, orbit: 21, size: 1.6, speed: .09, html: `
    <div class="kicker">Things I built</div><h2>Projects</h2>
    <h3><a href="${GH}Bayesian-Deep-Learning-for-Probabilistic-Financial-Forecasting" target="_blank" rel="noopener">Bayesian Deep Learning for Probabilistic Forecasting ↗</a></h3>
    <p>LSTM and Transformer baselines against Pyro variational inference and MC Dropout, scored on NLL, 95% coverage and sharpness. The Transformer had the best point accuracy but the least usable uncertainty.</p>
    <h3><a href="${GH}linkedin_sourcing_agent" target="_blank" rel="noopener">Multi-Agent Sourcing &amp; Matching Agent ↗</a></h3>
    <p>FastAPI, Gemini and OpenAI tool calling to turn unstructured profiles into ranked matches. <b>Runner-up, Synapse AI Hackathon.</b></p>
    <h3><a href="${GH}explainable-ai-fraud-detection" target="_blank" rel="noopener">AI Fraud Detection Interface ↗</a></h3>
    <p>RAG over FAISS with prompt engineering and structured validation.</p>
    <h3><a href="${GH}Token-Classification" target="_blank" rel="noopener">Biomedical Token Classification ↗</a></h3>
    <p>BioBERT fine-tuned on PLOD-CW-25: F1 0.84 on held-out data, served in a Streamlit app.</p>
    <h3><a href="${GH}Virtual-Fitting-Room" target="_blank" rel="noopener">AI Virtual Fitting Room ↗</a></h3>
    <p>GANs and OpenCV reconstruct a 3D body model from one 2D image, with AR try-on and a Django backend.</p>
    <h3><a href="${GH}fruit-blitz-vr" target="_blank" rel="noopener">Fruit Blitz VR ↗</a></h3>
    <p>A Unity VR take on Fruit Ninja with XR controller slicing, combos and scoring.</p>` },
  { id: 'research', title: 'Research', color: 0xfbbf24, orbit: 25, size: 1.0, speed: .07, html: `
    <div class="kicker">Papers &amp; study</div><h2>Research &amp; Education</h2>
    <h3>MSc Artificial Intelligence</h3><div class="meta">University of Surrey · 2025 – Feb 2026</div>
    <p>Dissertation (<b>Distinction</b>, published): <i>Hybrid Deep Learning and Graph Neural Networks for Alzheimer's Disease Prediction using scRNA-seq Data</i>, with SHAP interpretability. <a href="${GH}Prediction-of-Cellular-Mechanisms-Alzheimer--Disease" target="_blank" rel="noopener">Code ↗</a></p>
    <h3>B.Tech AI &amp; Data Science</h3><div class="meta">Anna University · First Class · 2021 – 2024</div>
    <p>Major project (published): an AI-powered virtual fitting room built on GANs.</p>
    <h3>Highlights</h3>
    <ul><li>Two published research papers</li><li>Runner-up, Synapse AI Hackathon</li><li>Distinction (90%) in AR/VR coursework, Surrey</li></ul>` },
  { id: 'stack', title: 'Tech Stack', color: 0x60a5fa, orbit: 29, size: 1.3, speed: .05, html: `
    <div class="kicker">Toolbox</div><h2>Tech Stack</h2>
    <h3>AI &amp; ML</h3><div class="chips">${chips('PyTorch TensorFlow scikit-learn Hugging_Face Pyro OpenCV YOLO CLIP GANs MLflow Optuna')}</div>
    <h3>LLMs &amp; Retrieval</h3><div class="chips">${chips('OpenAI Gemini Claude RAG FAISS pgvector Prompt_engineering')}</div>
    <h3>Engineering</h3><div class="chips">${chips('Python TypeScript JavaScript SQL FastAPI Django React Node.js Redis')}</div>
    <h3>Cloud &amp; Ops</h3><div class="chips">${chips('Docker AWS_Lambda AWS_S3 Azure_ML Linux CI/CD pytest')}</div>
    <h3>Automation</h3><div class="chips">${chips('n8n Zapier Make Claude_Code Cursor')}</div>` },
  { id: 'contact', title: 'Contact', color: 0xa78bfa, orbit: 33, size: .9, speed: .04, html: `
    <div class="kicker">Say hi</div><h2>Contact</h2>
    <p>Open to AI engineering roles in the UK.</p>
    <ul><li><a href="https://github.com/mohansree14" target="_blank" rel="noopener">github.com/mohansree14</a></li>
    <li><a href="https://www.linkedin.com/in/mohansree-vijyakumar/" target="_blank" rel="noopener">linkedin.com/in/mohansree-vijyakumar</a></li>
    <li><a href="https://mohansree.vercel.app/" target="_blank" rel="noopener">mohansree.vercel.app</a></li>
    <li><a href="mailto:mohansreevijayakumar@gmail.com">mohansreevijayakumar@gmail.com</a></li></ul>` },
];
function chips(s) { return s.split(' ').map(w => `<span class="chip">${w.replace(/_/g, ' ')}</span>`).join(''); }

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, .006);
const camera = new THREE.PerspectiveCamera(55, 1, .1, 1000);
const HOME_POS = new THREE.Vector3(0, 22, 52), HOME_TARGET = new THREE.Vector3();
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 6; controls.maxDistance = 110;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = .35;

scene.add(new THREE.AmbientLight(0xffffff, .35));
const sun = new THREE.PointLight(0xb9a8ff, 400, 0, 1.6);
scene.add(sun);

// Starfield
{
  const n = 4000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const v = new THREE.Vector3().randomDirection().multiplyScalar(150 + Math.random() * 250);
    pos.set([v.x, v.y, v.z], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .9, transparent: true, opacity: .8 })));
}

// Core: "me" as a glowing wireframe neural sphere
const core = new THREE.Group();
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(3, 1), new THREE.MeshBasicMaterial({ color: 0x7c5cff, wireframe: true, transparent: true, opacity: .55 })));
core.add(new THREE.Mesh(new THREE.SphereGeometry(2.2, 48, 48), new THREE.MeshBasicMaterial({ color: 0x2a1f66 })));
core.add(new THREE.Mesh(new THREE.IcosahedronGeometry(3.6, 2), new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: .12 })));
scene.add(core);

// Planets
const labelsEl = document.getElementById('labels');
const dock = document.getElementById('dock');
const planets = SECTIONS.map((s, i) => {
  const pivot = new THREE.Group();
  pivot.rotation.set((Math.random() - .5) * .25, i * 1.7, (Math.random() - .5) * .25);
  scene.add(pivot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(s.orbit - .03, s.orbit + .03, 160),
    new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: .18, side: THREE.DoubleSide }));
  ring.rotation.x = -Math.PI / 2;
  pivot.add(ring);
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(s.size, 40, 40),
    new THREE.MeshStandardMaterial({ color: s.color, emissive: s.color, emissiveIntensity: .35, roughness: .45, metalness: .2 }));
  mesh.position.x = s.orbit;
  mesh.add(new THREE.Mesh(new THREE.IcosahedronGeometry(s.size * 1.35, 1),
    new THREE.MeshBasicMaterial({ color: s.color, wireframe: true, transparent: true, opacity: .25 })));
  mesh.userData.section = s;
  pivot.add(mesh);

  const label = document.createElement('div');
  label.className = 'label'; label.textContent = s.title;
  label.onclick = () => focus(s.id);
  labelsEl.append(label);

  const btn = document.createElement('button');
  btn.textContent = s.title; btn.onclick = () => focus(s.id);
  dock.append(btn);
  return { s, pivot, mesh, label, btn };
});

// Interaction
const panel = document.getElementById('panel'), body = document.getElementById('panel-body');
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let focused = null, flying = false;
const wantPos = new THREE.Vector3(), wantTarget = new THREE.Vector3();

function focus(id) {
  focused = planets.find(p => p.s.id === id);
  body.innerHTML = focused.s.html;
  panel.classList.add('open');
  planets.forEach(p => p.btn.setAttribute('aria-pressed', p === focused));
  controls.autoRotate = false;
  flying = true;
  if (id === 'opensource') loadPrCount();
}
function unfocus() {
  focused = null;
  panel.classList.remove('open');
  planets.forEach(p => p.btn.setAttribute('aria-pressed', false));
  wantPos.copy(HOME_POS); wantTarget.copy(HOME_TARGET);
  controls.autoRotate = !reduceMotion;
  flying = true;
}
document.getElementById('close').onclick = unfocus;
addEventListener('keydown', e => { if (e.key === 'Escape') unfocus(); });
controls.addEventListener('start', () => { flying = false; });

function pick(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(planets.map(p => p.mesh), false)[0];
  return hit && planets.find(p => p.mesh === hit.object);
}
let downAt = 0;
canvas.addEventListener('pointerdown', () => { downAt = performance.now(); });
canvas.addEventListener('pointerup', e => {
  if (performance.now() - downAt > 250) return; // a drag, not a click
  const p = pick(e);
  if (p) focus(p.s.id);
});
canvas.addEventListener('pointermove', e => {
  const p = pick(e);
  canvas.style.cursor = p ? 'pointer' : 'grab';
  planets.forEach(q => q.mesh.scale.setScalar(q === p ? 1.15 : 1));
});

// Live merged-PR count; the static fallback stays if the API is rate-limited.
let prCount = null;
async function loadPrCount() {
  if (prCount === null) {
    try {
      const r = await fetch('https://api.github.com/search/issues?q=repo:kornia/kornia+author:mohansree14+is:pr+is:merged&per_page=1');
      if (r.ok) prCount = (await r.json()).total_count;
    } catch {}
  }
  const el = document.getElementById('pr-count');
  if (el && prCount) el.textContent = prCount;
}

// Render loop
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(), v = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05);
  if (!reduceMotion) {
    core.rotation.y += dt * .25; core.rotation.x += dt * .08;
    if (!focused) planets.forEach(p => { p.pivot.rotation.y += p.s.speed * dt; });
    planets.forEach(p => { p.mesh.rotation.y += dt * .5; });
  }
  if (focused) {
    focused.mesh.getWorldPosition(wantTarget);
    // Sit just outside the planet, on the side facing away from the core, nudged up.
    wantPos.copy(wantTarget).add(v.copy(wantTarget).setY(0).normalize().multiplyScalar(focused.s.size * 6).setY(focused.s.size * 2.5));
    if (innerWidth > 700) wantPos.add(v.crossVectors(wantTarget, camera.up).normalize().multiplyScalar(-focused.s.size * 2.2));
  }
  if (flying) {
    const k = 1 - Math.pow(.02, dt);
    camera.position.lerp(wantPos, k);
    controls.target.lerp(wantTarget, k);
    if (camera.position.distanceTo(wantPos) < .05) flying = false;
  }
  controls.update();
  renderer.render(scene, camera);

  for (const p of planets) {
    p.mesh.getWorldPosition(v).project(camera);
    const visible = v.z < 1;
    p.label.style.opacity = visible ? 1 : 0;
    p.label.style.left = (v.x * .5 + .5) * innerWidth + 'px';
    p.label.style.top = (-v.y * .5 + .5) * innerHeight + 'px';
  }
});
document.getElementById('loading').remove();
</script>
</body>
</html>
