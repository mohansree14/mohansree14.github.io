// ---------- Scene ----------
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 1, .1, 2000);
const HOME_POS = new THREE.Vector3(0, 22, 56), HOME_TARGET = new THREE.Vector3();
camera.position.copy(HOME_POS);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 160;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = .3;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .95, .55, .12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

scene.add(new THREE.AmbientLight(0xffffff, .3));
scene.add(new THREE.PointLight(0xc4b5fd, 600, 0, 1.6));

const rand = (a, b) => a + Math.random() * (b - a);
const updaters = []; // (t, dt) => void, run every frame
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .5, roughness: .3, metalness: .4, ...extra });
const glow = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
const wire = (color, opacity = .3) => new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity });

// Soft round sprite so points aren't squares
function dot() {
  const c = document.createElement('canvas'); c.width = c.height = 32;
  const x = c.getContext('2d'), g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}

// Stars
{
  const n = 5000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos.set(new THREE.Vector3().randomDirection().multiplyScalar(rand(250, 700)).toArray(), i * 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, map: dot(), alphaTest: .01, transparent: true, opacity: .7, depthWrite: false }));
  scene.add(stars);
  updaters.push((t, dt) => { stars.rotation.y += dt * .004; });
}

// Nebula clouds
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.4, 'rgba(255,255,255,.25)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  [[0x7c3aed, -180, 40, -300], [0x0891b2, 220, -30, -260], [0xdb2777, 60, 120, -380], [0x4338ca, -260, -80, 120]].forEach(([col, ...p]) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, color: col, transparent: true, opacity: .22, blending: THREE.AdditiveBlending, depthWrite: false }));
    s.position.set(...p); s.scale.setScalar(320);
    scene.add(s);
  });
}

// Shooting star
{
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(-10, 0, 0)]);
  const m = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
  const line = new THREE.Line(g, m), dir = new THREE.Vector3(), X = new THREE.Vector3(1, 0, 0);
  scene.add(line);
  let age = 99;
  updaters.push((t, dt) => {
    age += dt;
    if (age > rand(3, 7)) {
      age = 0;
      line.position.set(rand(-200, 200), rand(40, 120), rand(-250, -100));
      dir.set(rand(.5, 1) * (Math.random() < .5 ? -1 : 1), rand(-.6, -.2), rand(-.2, .2)).normalize();
      line.quaternion.setFromUnitVectors(X, dir);
    }
    line.position.addScaledVector(dir, dt * 140);
    m.opacity = Math.max(0, 1 - age / 1.1);
  });
}

// Core: a spiral galaxy around a bright heart
{
  const core = new THREE.Group();
  const n = 7000, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  const inner = new THREE.Color(0xe0d7ff), outer = new THREE.Color(0x22d3ee), tmp = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const r = Math.pow(Math.random(), 1.6) * 7 + .4, a = (i % 3) * Math.PI * 2 / 3 + r * .9 + rand(-.35, .35) * (1 + r * .1);
    pos.set([Math.cos(a) * r + rand(-.2, .2), rand(-.25, .25) * (1 - r / 8), Math.sin(a) * r + rand(-.2, .2)], i * 3);
    tmp.copy(inner).lerp(outer, r / 7.4).multiplyScalar(.85);
    col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const galaxy = new THREE.Points(g, new THREE.PointsMaterial({ size: .09, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  core.add(galaxy);
  const heart = new THREE.Mesh(new THREE.SphereGeometry(.9, 32, 32), new THREE.MeshBasicMaterial({ color: 0xf0eaff }));
  const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(2, 1), wire(0x7c5cff, .35));
  core.add(heart, shell);
  core.rotation.x = .25;
  scene.add(core);
  updaters.push((t, dt) => {
    galaxy.rotation.y += dt * .18;
    shell.rotation.y -= dt * .2; shell.rotation.z += dt * .1;
    heart.scale.setScalar(1 + Math.sin(t * 2) * .08);
  });
}

// ---------- Section objects: each one is its own little machine ----------
const BUILD = {
  about(c) { // glowing torus knot inside a wire shell
    const g = new THREE.Group();
    const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(.8, .24, 180, 24, 2, 3), std(c, { emissiveIntensity: .7 }));
    const shell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 1), wire(c, .2));
    g.add(knot, shell);
    updaters.push((t, dt) => { knot.rotation.x += dt * .6; knot.rotation.y += dt * .4; shell.rotation.y -= dt * .15; });
    return { group: g, size: 1.6 };
  },
  experience(c) { // gyroscope: career rings turning on their own axes
    const g = new THREE.Group();
    const rings = [1.5, 1.15, .8].map((r, i) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(r, .06, 16, 100), std([c, 0x7dd3fc, 0xa5f3fc][i], { emissiveIntensity: .9 }));
      g.add(m); return m;
    });
    g.add(new THREE.Mesh(new THREE.SphereGeometry(.35, 24, 24), glow(0xffffff)));
    updaters.push((t, dt) => {
      rings[0].rotation.x += dt * .7; rings[1].rotation.y += dt * 1.1; rings[2].rotation.x -= dt * 1.4; rings[2].rotation.z += dt * .6;
    });
    return { group: g, size: 1.6 };
  },
  opensource(c) { // crystal with one orbiting spark per merged PR
    const g = new THREE.Group();
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1.1, 0), std(c, { flatShading: true, emissiveIntensity: .6 }));
    crystal.scale.y = 1.5;
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(crystal.geometry), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .6 }));
    edges.scale.copy(crystal.scale);
    const MAX = 80, pos = new Float32Array(MAX * 3), seeds = Array.from({ length: MAX }, () => [rand(1.6, 2.4), rand(0, Math.PI * 2), rand(-.6, .6), rand(.4, 1)]);
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const sparks = new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xfde68a, size: .16, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    g.add(crystal, edges, sparks);
    updaters.push((t, dt) => {
      crystal.rotation.y += dt * .5; edges.rotation.y = crystal.rotation.y;
      sg.setDrawRange(0, Math.min(prCount, MAX));
      seeds.forEach(([r, a, y, s], i) => pos.set([Math.cos(a + t * s) * r, y + Math.sin(t * s * 2 + a) * .2, Math.sin(a + t * s) * r], i * 3));
      sg.attributes.position.needsUpdate = true;
    });
    return { group: g, size: 1.8 };
  },
  projects(c) { // ringed planet; the moons are added separately
    const g = new THREE.Group();
    const planet = new THREE.Mesh(new THREE.SphereGeometry(1.3, 48, 48), std(c, { emissiveIntensity: .2 }));
    const band = new THREE.Mesh(new THREE.RingGeometry(1.7, 2.4, 96), glow(c, .22));
    band.material.side = THREE.DoubleSide; band.rotation.x = -Math.PI / 2.4;
    g.add(planet, band, new THREE.Mesh(new THREE.SphereGeometry(1.45, 24, 24), wire(0xffffff, .08)));
    updaters.push((t, dt) => { planet.rotation.y += dt * .3; band.rotation.z += dt * .1; });
    return { group: g, size: 1.6 };
  },
  research(c) { // DNA double helix, for the scRNA-seq dissertation
    const g = new THREE.Group(), N = 26, bead = new THREE.SphereGeometry(.09, 12, 12);
    const rung = [];
    for (let i = 0; i < N; i++) {
      const a = i * .5, y = (i - N / 2) * .13, x = Math.cos(a) * .7, z = Math.sin(a) * .7;
      const b1 = new THREE.Mesh(bead, glow(c)); b1.position.set(x, y, z);
      const b2 = new THREE.Mesh(bead, glow(0xfb7185)); b2.position.set(-x, y, -z);
      g.add(b1, b2);
      rung.push(x, y, z, -x, y, -z);
    }
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(rung, 3));
    g.add(new THREE.LineSegments(rg, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .25 })));
    g.rotation.z = .35;
    updaters.push((t, dt) => { g.rotation.y += dt * .8; });
    return { group: g, size: 1.8 };
  },
  stack(c) { // breathing cube of cubes, one per tool
    const g = new THREE.Group(), cubes = [], box = new THREE.BoxGeometry(.4, .4, .4);
    const palette = [c, 0x22d3ee, 0xa78bfa, 0x34d399];
    for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
      const m = new THREE.Mesh(box, std(palette[cubes.length % 4], { emissiveIntensity: .6 }));
      m.userData.home = new THREE.Vector3(x, y, z).multiplyScalar(.5);
      g.add(m); cubes.push(m);
    }
    updaters.push((t, dt) => {
      g.rotation.x += dt * .3; g.rotation.y += dt * .45;
      const spread = 1 + Math.max(0, Math.sin(t * 1.3)) * .45;
      cubes.forEach((m, i) => { m.position.copy(m.userData.home).multiplyScalar(spread); m.rotation.y = Math.sin(t + i) * .5; });
    });
    return { group: g, size: 1.5 };
  },
  contact(c) { // beacon sending out signal waves
    const g = new THREE.Group();
    const mast = new THREE.Mesh(new THREE.ConeGeometry(.35, 1.4, 6), std(0x94a3b8, { emissiveIntensity: .15 }));
    mast.position.y = -.4;
    const tip = new THREE.Mesh(new THREE.SphereGeometry(.22, 20, 20), glow(c));
    tip.position.y = .45;
    g.add(mast, tip);
    const waves = [0, 1, 2].map(i => {
      const w = new THREE.Mesh(new THREE.TorusGeometry(1, .025, 8, 80), glow(c));
      w.position.y = .45; w.rotation.x = Math.PI / 2; g.add(w); return w;
    });
    updaters.push(t => {
      tip.scale.setScalar(1 + Math.sin(t * 6) * .25);
      waves.forEach((w, i) => { const k = (t * .6 + i / 3) % 1; w.scale.setScalar(.3 + k * 2.2); w.material.opacity = 1 - k; });
    });
    return { group: g, size: 1.5 };
  },
};

const MOON_GEO = {
  ico: () => new THREE.IcosahedronGeometry(.42, 0), dodeca: () => new THREE.DodecahedronGeometry(.42, 0),
  octa: () => new THREE.OctahedronGeometry(.45, 0), tetra: () => new THREE.TetrahedronGeometry(.5, 0),
  box: () => new THREE.BoxGeometry(.6, .6, .6), torus: () => new THREE.TorusGeometry(.32, .13, 12, 40),
  cone: () => new THREE.ConeGeometry(.35, .7, 8),
};

// ---------- Build the system ----------
const labelsEl = document.getElementById('labels'), dock = document.getElementById('dock');
const entries = []; // everything clickable: { id, kind, holder, size, fit, html, label, hit, color }
const hitMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });

function addEntry(e, labelClass = '') {
  e.label = document.createElement('div');
  e.label.className = 'label ' + labelClass; e.label.textContent = e.title;
  e.label.onclick = () => focus(e.id);
  labelsEl.append(e.label);
  e.hit = new THREE.Mesh(new THREE.SphereGeometry(e.size * 1.25, 12, 12), hitMat);
  e.hit.userData.entry = e;
  e.holder.add(e.hit);
  entries.push(e);
  return e;
}

SECTIONS.forEach((s, i) => {
  const pivot = new THREE.Group();
  pivot.rotation.set(rand(-.12, .12), i * 1.9, rand(-.12, .12));
  scene.add(pivot);
  const ring = new THREE.Mesh(new THREE.RingGeometry(s.orbit - .04, s.orbit + .04, 200), glow(s.color, .16));
  ring.material.side = THREE.DoubleSide; ring.rotation.x = -Math.PI / 2;
  pivot.add(ring);
  const holder = new THREE.Group();
  holder.position.x = s.orbit;
  pivot.add(holder);
  const { group, size } = BUILD[s.id](s.color);
  holder.add(group);
  const e = addEntry({ ...s, kind: 'section', holder, group, size, pivot });

  const btn = document.createElement('button');
  btn.textContent = s.title; btn.onclick = () => focus(s.id);
  dock.append(btn); e.btn = btn;

  if (s.id === 'projects') PROJECTS.forEach((p, j) => {
    const mp = new THREE.Group();
    mp.rotation.set(rand(-.5, .5), j / PROJECTS.length * Math.PI * 2, rand(-.5, .5));
    holder.add(mp);
    const r = 3 + j * .45;
    const orbitLine = new THREE.Mesh(new THREE.RingGeometry(r - .015, r + .015, 120), glow(p.color, .12));
    orbitLine.material.side = THREE.DoubleSide; orbitLine.rotation.x = -Math.PI / 2;
    mp.add(orbitLine);
    const moonHolder = new THREE.Group();
    moonHolder.position.x = r;
    const moon = new THREE.Mesh(MOON_GEO[p.geo](), std(p.color, { flatShading: true, emissiveIntensity: .45 }));
    moonHolder.add(moon);
    mp.add(moonHolder);
    const speed = .35 - j * .03;
    updaters.push((t, dt) => {
      if (!focused && !reduceMotion) mp.rotation.y += speed * dt;
      moon.rotation.x += dt * .9; moon.rotation.y += dt * .6;
    });
    addEntry({ ...p, kind: 'project', holder: moonHolder, around: holder, group: moon, size: .5, fit: 4.2, html: () => projectHtml(p) }, 'moon');
  });
});

// ---------- Effects ----------
const bursts = [];
function burst(at, color) {
  const n = 160, pos = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) { pos.set(at.toArray(), i * 3); vel.push(new THREE.Vector3().randomDirection().multiplyScalar(rand(1.5, 6))); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size: .14, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(pts);
  bursts.push({ pts, vel, life: 1 });
}
function stepBursts(dt) {
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], a = b.pts.geometry.attributes.position;
    b.life -= dt * .9;
    b.vel.forEach((v, k) => { v.multiplyScalar(1 - dt * 1.5); a.setXYZ(k, a.getX(k) + v.x * dt, a.getY(k) + v.y * dt, a.getZ(k) + v.z * dt); });
    a.needsUpdate = true;
    b.pts.material.opacity = Math.max(0, b.life);
    if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }
}

// ---------- Interaction ----------
const panel = document.getElementById('panel'), body = document.getElementById('panel-body');
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let focused = null, flying = false, hovered = null;
const wantPos = new THREE.Vector3(), wantTarget = new THREE.Vector3(), tmpV = new THREE.Vector3(), side = new THREE.Vector3();

const backdrop = document.getElementById('backdrop');
let popTimer;
function showPanel(on) { panel.classList.toggle('open', on); backdrop.classList.toggle('open', on); }
function focus(id) {
  focused = entries.find(e => e.id === id);
  // Fly in first, then pop the card up in the middle.
  showPanel(false);
  clearTimeout(popTimer);
  const f = focused;
  popTimer = setTimeout(() => { body.innerHTML = f.html(); panel.scrollTop = 0; showPanel(true); }, 650);
  entries.forEach(e => e.btn && e.btn.setAttribute('aria-pressed', e === focused || (focused.kind === 'project' && e.id === 'projects')));
  controls.autoRotate = false;
  flying = true;
  burst(focused.holder.getWorldPosition(tmpV).clone(), focused.color);
}
function unfocus() {
  focused = null;
  clearTimeout(popTimer);
  showPanel(false);
  entries.forEach(e => e.btn && e.btn.setAttribute('aria-pressed', false));
  wantPos.copy(HOME_POS); wantTarget.copy(HOME_TARGET);
  controls.autoRotate = !reduceMotion;
  flying = true;
}
document.getElementById('close').onclick = unfocus;
backdrop.onclick = unfocus;
body.addEventListener('click', e => { const go = e.target.closest('[data-go]'); if (go) focus(go.dataset.go); });
addEventListener('keydown', e => { if (e.key === 'Escape') unfocus(); });
controls.addEventListener('start', () => { flying = false; });

function pick(e) {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(entries.map(x => x.hit), false);
  // Prefer moons over the big Projects hitbox they sit inside.
  return (hits.find(h => h.object.userData.entry.kind === 'project') || hits[0])?.object.userData.entry;
}
let downAt = 0;
canvas.addEventListener('pointerdown', () => { downAt = performance.now(); });
canvas.addEventListener('pointerup', e => {
  if (performance.now() - downAt > 250) return; // a drag, not a click
  const hit = pick(e);
  if (hit) focus(hit.id);
});
canvas.addEventListener('pointermove', e => {
  hovered = pick(e);
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
});

// Live merged-PR count; the static fallback stays if the API is rate-limited.
let prCount = 19;
fetch('https://api.github.com/search/issues?q=repo:kornia/kornia+author:mohansree14+is:pr+is:merged&per_page=1')
  .then(r => r.ok ? r.json() : null).then(j => { if (j?.total_count) prCount = j.total_count; }).catch(() => {});

// ---------- Loop ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!reduceMotion) updaters.forEach(u => u(t, dt));
  if (!focused && !reduceMotion) entries.forEach(e => { if (e.pivot) e.pivot.rotation.y += e.speed * dt; });
  entries.forEach(e => e.group.scale.lerp(tmpV.setScalar(e === hovered || e === focused ? 1.18 : 1), .15));
  stepBursts(dt);

  if (focused) {
    focused.holder.getWorldPosition(wantTarget);
    // Sit outside the object on the side facing away from what it orbits (the core, or a moon's planet), a little above it.
    if (focused.around) focused.around.getWorldPosition(side); else side.set(0, 0, 0);
    tmpV.copy(wantTarget).sub(side).setY(0);
    if (tmpV.lengthSq() < 1e-6) tmpV.set(0, 0, 1);
    tmpV.normalize();
    // Moons: come in from the side so their planet's glow isn't the whole backdrop.
    if (focused.around) tmpV.add(side.crossVectors(tmpV, camera.up).multiplyScalar(1.6)).normalize();
    wantPos.copy(wantTarget).add(tmpV.multiplyScalar(focused.fit)).add(tmpV.set(0, focused.fit * .4, 0));
  }
  if (flying) {
    const k = 1 - Math.pow(.015, dt);
    camera.position.lerp(wantPos, k);
    controls.target.lerp(wantTarget, k);
    if (camera.position.distanceTo(wantPos) < .03) flying = false;
  } else if (focused) {
    controls.target.lerp(wantTarget, .1);
  }
  controls.update();
  composer.render();

  const showMoons = focused && (focused.id === 'projects' || focused.kind === 'project');
  for (const e of entries) {
    e.holder.getWorldPosition(tmpV);
    const dist = tmpV.distanceTo(camera.position);
    tmpV.project(camera);
    const visible = tmpV.z < 1 && (e.kind === 'section' || showMoons || e === hovered) && dist > e.size * 1.5 && e !== focused;
    e.label.style.opacity = visible ? 1 : 0;
    e.label.style.pointerEvents = visible ? 'auto' : 'none';
    e.label.classList.toggle('hot', e === hovered);
    e.label.style.left = (tmpV.x * .5 + .5) * innerWidth + 'px';
    e.label.style.top = (-tmpV.y * .5 + .5) * innerHeight + 'px';
  }
});
document.getElementById('loading').remove();

// Deep links: /#projects, /#bayes, ... open straight to that object.
const fromHash = () => { const id = location.hash.slice(1); if (entries.some(e => e.id === id)) focus(id); };
addEventListener('hashchange', fromHash); fromHash();
</script>
