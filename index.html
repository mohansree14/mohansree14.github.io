const rand = (a, b) => a + Math.random() * (b - a);
const updaters = [];
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .5, roughness: .35, metalness: .4, ...extra });
const glow = (color, opacity = 1) => new THREE.MeshBasicMaterial({ color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const wire = (color, opacity = .3) => new THREE.MeshBasicMaterial({ color, wireframe: true, transparent: true, opacity });

// Windows texture shared by every building (cloned per building so the repeat fits its size)
const WINDOWS = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#04050b'; x.fillRect(0, 0, 64, 128);
  const lit = ['#9be7ff', '#c4b5fd', '#fde68a', '#f0abfc'];
  for (let r = 0; r < 16; r++) for (let k = 0; k < 8; k++) {
    if (Math.random() < .42) { x.globalAlpha = rand(.35, 1); x.fillStyle = lit[(Math.random() * lit.length) | 0]; x.fillRect(k * 8 + 2, r * 8 + 2, 4, 5); }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
})();
function windowMat(tint, rx, ry) {
  const map = WINDOWS.clone(); map.repeat.set(rx, ry); map.needsUpdate = true;
  return new THREE.MeshStandardMaterial({ color: 0x0b0e1c, roughness: .55, metalness: .5,
    emissive: new THREE.Color(tint).lerp(new THREE.Color(0xffffff), .55), emissiveMap: map, emissiveIntensity: 1.1 });
}

// Buildings rise out of the ground on load, outward from HQ.
const risers = [];
function rise(group, delay) { group.scale.y = reduceMotion ? 1 : .001; risers.push({ group, delay }); }

function building({ x, z, w = 4.5, d = 4.5, h = 8, color }) {
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const geo = new THREE.BoxGeometry(w, h, d); geo.translate(0, h / 2, 0);
  const side = windowMat(color, w / 3, h / 4);
  const roof = new THREE.MeshStandardMaterial({ color: 0x0a0c16, emissive: color, emissiveIntensity: .2 });
  const mesh = new THREE.Mesh(geo, [side, side, roof, roof, side, side]);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color, transparent: true, opacity: .55 }));
  g.add(mesh, edges);
  scene.add(g);
  rise(g, Math.hypot(x, z) * .012 + .3);
  return { g, mesh, edges, h };
}

// Roads from HQ to every district, with traffic
const ROADS = DISTRICTS.slice(1).map(D => [0, 0, D.x, D.z, D.color]);
ROADS.forEach(([ax, az, bx, bz, color]) => {
  const dx = bx - ax, dz = bz - az, len = Math.hypot(dx, dz);
  const road = new THREE.Group();
  road.position.set((ax + bx) / 2, .04, (az + bz) / 2);
  road.rotation.y = -Math.atan2(dz, dx);
  const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(len, 2.6), new THREE.MeshStandardMaterial({ color: 0x0b0d1a, roughness: .8 }));
  asphalt.rotation.x = -Math.PI / 2;
  road.add(asphalt);
  [-1.3, 1.3].forEach(o => {
    const edge = new THREE.Mesh(new THREE.PlaneGeometry(len, .1), glow(color, .7));
    edge.rotation.x = -Math.PI / 2; edge.position.set(0, .01, o); road.add(edge);
  });
  scene.add(road);
  const perp = new THREE.Vector3(-dz, 0, dx).normalize();
  for (let k = 0; k < 4; k++) {
    const back = k % 2 === 1;
    const car = new THREE.Mesh(new THREE.BoxGeometry(.5, .3, 1), new THREE.MeshBasicMaterial({ color: back ? 0xff4d6d : 0xe0f2fe }));
    scene.add(car);
    const speed = rand(.05, .09), off = k / 4;
    const a = new THREE.Vector3(ax, .3, az).addScaledVector(perp, back ? .6 : -.6), b = new THREE.Vector3(bx, .3, bz).addScaledVector(perp, back ? .6 : -.6);
    updaters.push(t => {
      let u = (t * speed + off) % 1; if (back) u = 1 - u;
      car.position.lerpVectors(a, b, u);
      car.lookAt(back ? a : b);
    });
  }
});

// Kornia Tower: one floor per merged PR
const floors = [];
{
  const color = 0xf472b6, MAX = 60, g = new THREE.Group(), slab = new THREE.BoxGeometry(6.5, .75, 6.5), slabEdges = new THREE.EdgesGeometry(slab);
  const edgeMat = new THREE.LineBasicMaterial({ color: 0xffd1ec, transparent: true, opacity: .6 });
  g.position.set(0, 0, -44);
  for (let i = 0; i < MAX; i++) {
    const m = new THREE.Mesh(slab, std(i % 2 ? color : 0xec4899, { emissiveIntensity: .45 }));
    m.position.y = .4 + i * 1.1;
    m.rotation.y = i * .06; // a gentle twist up the tower
    m.add(new THREE.LineSegments(slabEdges, edgeMat));
    g.add(m); floors.push(m);
  }
  const crown = new THREE.Mesh(new THREE.OctahedronGeometry(1.4, 0), std(0xfde68a, { emissiveIntensity: 1.2 }));
  g.add(crown);
  scene.add(g); rise(g, .6);
  const setFloors = () => {
    const n = Math.min(prCount, MAX);
    floors.forEach((f, i) => f.visible = i < n);
    crown.position.y = n * 1.1 + 2.2;
    D('opensource').lh = n * 1.1 + 5;
  };
  setFloors();
  updaters.push((t, dt) => {
    crown.rotation.y += dt * 1.2;
    floors.forEach((f, i) => { if (f.visible) f.material.emissiveIntensity = .3 + .35 * Math.max(0, Math.sin(t * 2 - i * .35)); });
  });
  addEntry({ id: 'opensource', title: 'Kornia Tower', color, focus: new THREE.Vector3(0, 11, -44), fit: 44, html: HTML.opensource, tip: `🗼 Kornia Tower · ${prCount} merged PRs` }, [...floors, crown]);
  fetch('https://api.github.com/search/issues?q=repo:kornia/kornia+author:mohansree14+is:pr+is:merged&per_page=1')
    .then(r => r.ok ? r.json() : null).then(j => {
      if (!j?.total_count) return;
      prCount = j.total_count;
      document.getElementById('st-pr').textContent = prCount;
      entries.find(e => e.id === 'opensource').tip = `🗼 Kornia Tower · ${prCount} merged PRs`;
      setFloors();
    }).catch(() => {});
}

// ================= Effects =================
const bursts = [];
function burst(at, color) {
  const n = 180, pos = new Float32Array(n * 3), vel = [];
  for (let i = 0; i < n; i++) { pos.set(at.toArray(), i * 3); const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y); vel.push(v.multiplyScalar(rand(3, 10))); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({ color, size: .3, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(pts); bursts.push({ pts, vel, life: 1 });
}

// ================= Camera travel, pop-up =================
const panel = document.getElementById('panel'), body = document.getElementById('panel-body'), backdrop = document.getElementById('backdrop');
const wantPos = new THREE.Vector3(62, 78, 96), wantTarget = new THREE.Vector3(0, 0, 4), tmp = new THREE.Vector3(), sph = new THREE.Spherical();
let flying = true, focused = null, popTimer, hovered = null;

function flyTo(target, dist) {
  sph.setFromVector3(tmp.subVectors(camera.position, controls.target));
  sph.radius = dist; sph.phi = THREE.MathUtils.clamp(sph.phi, .65, 1.05);
  wantTarget.copy(target);
  wantPos.copy(target).add(tmp.setFromSpherical(sph));
  flying = true;
}
function showPanel(on) { panel.classList.toggle('open', on); backdrop.classList.toggle('open', on); }
function focus(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  focused = e;
  flyTo(e.focus, e.fit);
  burst(e.focus.clone(), e.color);
  const district = e.kind === 'job' ? 'experience' : e.kind === 'project' ? 'projects' : e.kind === 'skill' ? 'stack' : e.id;
  dock.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === district));
  showPanel(false);
  clearTimeout(popTimer);
  popTimer = setTimeout(() => { body.innerHTML = e.html(); panel.scrollTop = 0; showPanel(true); }, 700);
  history.replaceState(null, '', '#' + id);
}
function unfocus() {
  focused = null;
  clearTimeout(popTimer);
  showPanel(false);
  dock.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', false));
  history.replaceState(null, '', location.pathname);
}
document.getElementById('close').onclick = unfocus;
backdrop.onclick = unfocus;
body.addEventListener('click', ev => { const go = ev.target.closest('[data-go]'); if (go) focus(go.dataset.go); });
controls.addEventListener('start', () => { flying = false; });

// Picking
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(ev) {
  ptr.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  return ray.intersectObjects(pickables, false)[0]?.object;
}
let down = null;
canvas.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', ev => {
  if (!down || performance.now() - down.t > 300 || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) return; // a drag
  const m = pick(ev);
  if (m) focus(m.userData.entry.id);
});
canvas.addEventListener('pointermove', ev => {
  const m = pick(ev);
  hovered = m?.userData.entry || null;
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
  if (hovered) {
    tipEl.innerHTML = m.userData.tip || hovered.tip || hovered.title;
    tipEl.style.left = ev.clientX + 14 + 'px'; tipEl.style.top = ev.clientY + 14 + 'px';
  }
  tipEl.style.opacity = hovered ? 1 : 0;
});
canvas.addEventListener('pointerleave', () => { hovered = null; tipEl.style.opacity = 0; });

// Keyboard: WASD / arrows to fly over the city
const keys = new Set();
addEventListener('keydown', ev => {
  if (ev.key === 'Escape') return unfocus();
  const k = ev.key.toLowerCase();
  if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { keys.add(k); ev.preventDefault(); }
});
addEventListener('keyup', ev => keys.delete(ev.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

// ================= Minimap =================
const mm = document.getElementById('minimap'), mx = mm.getContext('2d');
const MM = 180, SPAN = 80, toMM = (x, z) => [(x + SPAN) / (2 * SPAN) * MM, (z + SPAN) / (2 * SPAN) * MM];
mx.scale(2, 2);
mm.addEventListener('click', ev => {
  const r = mm.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * 2 * SPAN - SPAN, z = (ev.clientY - r.top) / r.height * 2 * SPAN - SPAN;
  // Travel to a district if the click landed on one, otherwise just fly there
  const near = DISTRICTS.find(d => Math.abs(d.x - x) < d.w / 2 + 3 && Math.abs(d.z - z) < d.d / 2 + 3);
  if (near) focus(near.id); else flyTo(new THREE.Vector3(x, 0, z), camera.position.distanceTo(controls.target));
});
const hex = c => '#' + new THREE.Color(c).getHexString();
function drawMinimap() {
  mx.clearRect(0, 0, MM, MM);
  mx.fillStyle = '#070917'; mx.fillRect(0, 0, MM, MM);
  mx.lineWidth = 2;
  ROADS.forEach(([ax, az, bx, bz]) => { mx.strokeStyle = '#1f2547'; mx.beginPath(); mx.moveTo(...toMM(ax, az)); mx.lineTo(...toMM(bx, bz)); mx.stroke(); });
  DISTRICTS.forEach(d => {
    const [x, y] = toMM(d.x - d.w / 2, d.z - d.d / 2), w = d.w / (2 * SPAN) * MM, h = d.d / (2 * SPAN) * MM;
    mx.fillStyle = hex(d.color) + '40'; mx.strokeStyle = hex(d.color);
    mx.lineWidth = 1; mx.fillRect(x, y, w, h); mx.strokeRect(x, y, w, h);
  });
  entries.forEach(e => {
    if (!e.meshes.length || !e.kind) return;
    const [x, y] = toMM(e.focus.x, e.focus.z);
    mx.fillStyle = hex(e.color); mx.fillRect(x - 1.5, y - 1.5, 3, 3);
  });
  // You are here: target dot + view cone
  const [tx, ty] = toMM(controls.target.x, controls.target.z);
  const ang = Math.atan2(controls.target.z - camera.position.z, controls.target.x - camera.position.x);
  const [cx, cy] = toMM(camera.position.x, camera.position.z);
  mx.fillStyle = 'rgba(255,255,255,.12)';
  mx.beginPath(); mx.moveTo(cx, cy); mx.arc(cx, cy, Math.hypot(tx - cx, ty - cy) + 18, ang - .45, ang + .45); mx.closePath(); mx.fill();
  mx.fillStyle = '#fff'; mx.beginPath(); mx.arc(tx, ty, 3, 0, Math.PI * 2); mx.fill();
}

// ================= Loop =================
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(), fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!reduceMotion) updaters.forEach(u => u(t, dt));
  risers.forEach(r => { const s = THREE.MathUtils.clamp((t - r.delay) / 1.3, 0, 1); r.group.scale.y = reduceMotion ? 1 : Math.max(.001, 1 - Math.pow(1 - s, 3)); });

  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i], a = b.pts.geometry.attributes.position;
    b.life -= dt * .8;
    b.vel.forEach((v, k) => { v.y -= dt * 6; v.multiplyScalar(1 - dt); a.setXYZ(k, a.getX(k) + v.x * dt, a.getY(k) + v.y * dt, a.getZ(k) + v.z * dt); });
    a.needsUpdate = true; b.pts.material.opacity = Math.max(0, b.life);
    if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }

  // Hover highlight
  entries.forEach(e => e.edges.forEach(l => l.material.opacity = e === hovered || e === focused ? 1 : .55));
  const hl = hovered || focused;
  hoverRing.visible = !!(hl && hl.meshes.length);
  if (hoverRing.visible) {
    hoverRing.position.set(hl.focus.x, .08, hl.focus.z);
    hoverRing.scale.setScalar((hl.kind === 'skill' ? 5 : hl.kind ? 4.5 : 9) * (1 + Math.sin(t * 4) * .06));
  }

  if (keys.size && !panel.classList.contains('open')) {
    fwd.subVectors(controls.target, camera.position).setY(0).normalize();
    right.crossVectors(fwd, camera.up);
    move.set(0, 0, 0)
      .addScaledVector(fwd, (keys.has('w') || keys.has('arrowup') ? 1 : 0) - (keys.has('s') || keys.has('arrowdown') ? 1 : 0))
      .addScaledVector(right, (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0));
    if (move.lengthSq()) { move.setLength(dt * 40); controls.target.add(move); camera.position.add(move); flying = false; }
  }
  if (flying) {
    const k = 1 - Math.pow(.02, dt);
    camera.position.lerp(wantPos, k); controls.target.lerp(wantTarget, k);
    if (camera.position.distanceTo(wantPos) < .05) flying = false;
  }
  controls.update();
  // Keep the camera over the city
  tmp.copy(controls.target);
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -75, 75);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -75, 75);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, 0, 20);
  camera.position.add(tmp.subVectors(controls.target, tmp));

  composer.render();

  for (const l of labels) {
    const p = l.pos.get(), dist = p.distanceTo(camera.position);
    tmp.copy(p).project(camera);
    const show = tmp.z < 1 && (l.cls !== 'year' || dist < 70);
    l.el.style.opacity = show ? 1 : 0;
    l.el.style.pointerEvents = show && !l.cls ? 'auto' : 'none';
    l.el.style.left = (tmp.x * .5 + .5) * innerWidth + 'px';
    l.el.style.top = (-tmp.y * .5 + .5) * innerHeight + 'px';
  }
  if (innerWidth > 760) drawMinimap();
});

const loading = document.getElementById('loading');
loading.style.opacity = 0; setTimeout(() => loading.remove(), 700);

// Deep links: /#bayes, /#wtd, /#opensource ... open straight to that place.
const fromHash = () => { const id = decodeURIComponent(location.hash.slice(1)); if (entries.some(e => e.id === id)) focus(id); };
addEventListener('hashchange', fromHash);
setTimeout(fromHash, 1600); // after the intro flight
</script>
</body>
</html>
